<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Maker - Transform Books into Study Cards</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Card Maker</h1>
            <p class="subtitle">Transform books, PDFs, and syllabi into concise study cards</p>
        </header>

        <div class="upload-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('file')">
                    📄 Upload File
                </button>
                <button class="tab-btn" onclick="switchTab('text')">
                    ✍️ Paste Text
                </button>
            </div>

            <!-- File Upload Tab -->
            <div id="file-tab" class="tab-content active">
                <div class="upload-box">
                    <div class="upload-icon">📤</div>
                    <h3>Upload your document</h3>
                    <p>Supports PDF and TXT files (up to 50MB)</p>
                    <input type="file" id="fileInput" accept=".pdf,.txt" hidden>
                    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                        Choose File
                    </button>
                    <div id="fileName" class="file-name"></div>
                </div>

                <div class="options">
                    <label>
                        Number of cards to generate:
                        <input type="number" id="numCards" value="10" min="5" max="50">
                    </label>
                </div>

                <button class="btn-generate" id="generateBtn" onclick="generateCardsFromFile()" disabled>
                    Generate Cards ✨
                </button>
            </div>

            <!-- Text Input Tab -->
            <div id="text-tab" class="tab-content">
                <textarea 
                    id="textInput" 
                    placeholder="Paste your book content, syllabus, or study material here..."
                    rows="10"
                ></textarea>

                <div class="options">
                    <label>
                        Number of cards to generate:
                        <input type="number" id="numCardsText" value="10" min="5" max="50">
                    </label>
                </div>

                <button class="btn-generate" onclick="generateCardsFromText()">
                    Generate Cards ✨
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Analyzing content and generating cards...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error hidden"></div>

        <!-- Cards Display -->
        <div id="cardsContainer" class="cards-container hidden">
            <div class="cards-header">
                <h2>Your Study Cards (<span id="cardCount">0</span>)</h2>
                <div class="cards-actions">
                    <button class="btn-secondary" onclick="exportCards('json')">
                        💾 Export JSON
                    </button>
                    <button class="btn-secondary" onclick="exportCards('text')">
                        📝 Export Text
                    </button>
                    <button class="btn-secondary" onclick="printCards()">
                        🖨️ Print
                    </button>
                </div>
            </div>

            <div class="filter-section">
                <label>
                    Filter by importance:
                    <select id="importanceFilter" onchange="filterCards()">
                        <option value="all">All Cards</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="low">Low Priority</option>
                    </select>
                </label>
            </div>

            <div id="cards" class="cards-grid"></div>
        </div>
    </div>

    <script src="../static/script.js"></script>
</body>
</html>
